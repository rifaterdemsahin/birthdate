<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://birthdate-party.fly.dev/">
    <link rel="canonical" href="https://birthdate-party.fly.dev/">
    <title>Party site moved</title>
    <script>
        (function () {
            var base = "https://birthdate-party.fly.dev";
            var path = location.pathname.replace(/^\/birthdate\/?/, "/");
            if (!path) path = "/";
            location.replace(base + path + location.search + location.hash);
        })();
    </script>
</head>
<body>
    <p>The birthday site now lives at <a href="https://birthdate-party.fly.dev/">birthdate-party.fly.dev</a>.</p>
</body>
</html>
