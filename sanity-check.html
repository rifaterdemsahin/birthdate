        .checklist li { margin-bottom: 10px; font-size: 1.1em; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 10px; cursor: pointer; }
    </style>

        <h1>✅ Project Sanity Check</h1>
        <p>Use this checklist to ensure all critical tasks are handled before the party.</p>
        
        <ul class="checklist">
            <li><label><input type="checkbox" id="s1" class="sanity-chk" onchange="saveSanity()"> 🤝 Confirm joint party date and venue with Ryan Walter (Emma's Dad)</label></li>
            <li><label><input type="checkbox" id="s2" class="sanity-chk" onchange="saveSanity()"> 📍 Confirm Venue Booking</label></li>
            <li><label><input type="checkbox" id="s3" class="sanity-chk" onchange="saveSanity()"> 🌦️ Check Weather Forecast 3 days prior</label></li>
            <li><label><input type="checkbox" id="s4" class="sanity-chk" onchange="saveSanity()"> 💌 Send out Invitations (Physical & Digital)</label></li>
            <li><label><input type="checkbox" id="s5" class="sanity-chk" onchange="saveSanity()"> 📋 Track RSVPs & Dietary Requirements</label></li>
            <li><label><input type="checkbox" id="s6" class="sanity-chk" onchange="saveSanity()"> 🛒 Finalize Menu and Shopping List</label></li>
            <li><label><input type="checkbox" id="s7" class="sanity-chk" onchange="saveSanity()"> 🎂 Order Birthday Cakes</label></li>
            <li><label><input type="checkbox" id="s8" class="sanity-chk" onchange="saveSanity()"> 🎈 Buy Decorations (Balloons, Banners)</label></li>
            <li><label><input type="checkbox" id="s9" class="sanity-chk" onchange="saveSanity()"> 🛍️ Prepare Party Favors/Goodie Bags</label></li>
            <li><label><input type="checkbox" id="s10" class="sanity-chk" onchange="saveSanity()"> 📸 Charge Camera/Phones for Photos</label></li>
        </ul>
        <button onclick="copySanity()" style="margin-top: 10px; padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">📋 Copy Checklist</button>
    </div>

    <script>
        function saveSanity() {
            document.querySelectorAll('.sanity-chk').forEach(c => localStorage.setItem('sanity_' + c.id, c.checked));
        }
        function copySanity() {
            let text = "✅ Project Sanity Check:\n";
            document.querySelectorAll('.sanity-chk').forEach(c => {
                text += (c.checked ? "✅ " : "❌ ") + c.parentElement.innerText + "\n";
            });
            navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
        }
        window.addEventListener('load', () => {
            document.querySelectorAll('.sanity-chk').forEach(c => {
                if (localStorage.getItem('sanity_' + c.id) === 'true') c.checked = true;
            });
        });
    </script>
